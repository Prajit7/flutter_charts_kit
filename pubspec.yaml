name: flutter_charts_kit
description: Zero-dependency interactive 2D and 3D Flutter charts for dashboards and fintech apps, with trading candlesticks, indicators, drawing tools, option payoffs, maps and network graphs.
version: 0.3.0
homepage: https://github.com/prajit7/flutter_charts_kit
repository: https://github.com/prajit7/flutter_charts_kit
issue_tracker: https://github.com/prajit7/flutter_charts_kit/issues
topics:
  - chart
  - charts
  - visualization
  - three-dimensional
  - widgets

screenshots:
  - description: Trading chart with SMA, EMA, Bollinger Bands, RSI, MACD and a live last-price tag.
    path: example/assets/trading.png
  - description: 2D charts — line, stacked area, combo, horizontal bar, donut and scatter.
    path: example/assets/2d.png
  - description: 3D surface, wireframe with contours, 3D bars and 3D scatter.
    path: example/assets/3d.png
  - description: Waterfall, bullet, calendar heatmap, sunburst, rose, radial bars, range, dumbbell and Gantt charts.
    path: example/assets/business.png
  - description: Option payoff, open interest, market depth, volatility smile, Heikin-Ashi with volume profile and drawings, Renko.
    path: example/assets/options.png
  - description: Indicators, symbol comparison, alerts, option Greeks and OI through the session.
    path: example/assets/trading_tools.png
  - description: Bump, slope, Marimekko, streamgraph, beeswarm, ridgeline, org chart and timeline.
    path: example/assets/stories.png
  - description: World choropleth map, network graph, chord diagram and parallel coordinates.
    path: example/assets/graphs_maps.png
  - description: Heatmap, candlestick, radar, histogram, box plot, gauges, funnel, treemap and Sankey.
    path: example/assets/more.png

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
